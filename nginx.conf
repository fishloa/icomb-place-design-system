server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CORS headers for CSS files consumed by other apps
    location ~* \.(css|woff2?|ttf|eot)$ {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
    }

    # Cache static assets
    location ~* \.(html|md)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Health check
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
